<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-label="Ilustrasi genset diesel PLTD: bodi mesin, radiator, cerobong knalpot, dan panel kontrol">
  <defs>
    <linearGradient id="dbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#062b48"/>
      <stop offset="1" stop-color="#0d6a9c"/>
    </linearGradient>
    <linearGradient id="dbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4c65a"/>
      <stop offset="1" stop-color="#d8952a"/>
    </linearGradient>
    <linearGradient id="dskid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#20303a"/>
      <stop offset="1" stop-color="#101c24"/>
    </linearGradient>
  </defs>

  <rect width="800" height="440" fill="url(#dbg)"/>

  <!-- horizon rings -->
  <g fill="none" stroke="#bfe8ff" stroke-opacity=".14">
    <circle cx="150" cy="70" r="120"/>
  </g>

  <!-- ground -->
  <rect x="0" y="360" width="800" height="5" fill="#0a4a78"/>

  <!-- exhaust stack + puff -->
  <path d="M250 150 h26 v-70 h20 v70 h6" fill="none" stroke="#cbeeff" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#cfe9f6" fill-opacity=".55">
    <circle cx="300" cy="66" r="14"/><circle cx="320" cy="54" r="11"/><circle cx="336" cy="46" r="8"/>
  </g>

  <!-- generator canopy body -->
  <rect x="230" y="150" width="360" height="150" rx="18" fill="url(#dbody)" stroke="#a86f16" stroke-width="4"/>
  <!-- body seam + lifting lugs -->
  <path d="M230 190 H590" stroke="#a86f16" stroke-width="3"/>
  <g fill="none" stroke="#a86f16" stroke-width="5" stroke-linecap="round">
    <path d="M300 150 v-14 h20"/><path d="M520 150 v-14 h-20"/>
  </g>

  <!-- radiator grille (left end) -->
  <g stroke="#8a5c12" stroke-width="4">
    <path d="M250 175 V275"/><path d="M266 175 V275"/><path d="M282 175 V275"/><path d="M298 175 V275"/>
  </g>

  <!-- control panel + gauges -->
  <rect x="470" y="178" width="96" height="94" rx="8" fill="#0e2a3f" stroke="#f0e6cf" stroke-width="3"/>
  <circle cx="498" cy="206" r="12" fill="#0a1c2a" stroke="#7fd0f2" stroke-width="3"/>
  <path d="M498 206 l8 -6" stroke="#3fd08a" stroke-width="3" stroke-linecap="round"/>
  <circle cx="538" cy="206" r="12" fill="#0a1c2a" stroke="#7fd0f2" stroke-width="3"/>
  <path d="M538 206 l7 6" stroke="#d82f32" stroke-width="3" stroke-linecap="round"/>
  <rect x="486" y="234" width="64" height="9" rx="4" fill="#3fd08a"/>
  <rect x="486" y="250" width="64" height="9" rx="4" fill="#f4c65a"/>

  <!-- skid base -->
  <rect x="210" y="300" width="400" height="40" rx="6" fill="url(#dskid)"/>
  <g stroke="#3a4b56" stroke-width="3">
    <path d="M250 300 v40"/><path d="M400 300 v40"/><path d="M560 300 v40"/>
  </g>

  <!-- power bolt accent -->
  <path d="M636 176 l-30 52 h22 l-14 44 40 -60 h-22 z" fill="#f4c65a" stroke="#a86f16" stroke-width="2" stroke-linejoin="round"/>
</svg>
